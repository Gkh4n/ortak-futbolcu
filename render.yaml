services:
  - type: web
    name: ortak-futbolcu
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ortak-futbolcu-db
          property: connectionString

databases:
  - name: ortak-futbolcu-db
    region: frankfurt
    plan: free
    databaseName: ortakfutbolcu
    user: ortakfutbolcu
