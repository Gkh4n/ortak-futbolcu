name: Import game source
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover archived source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ortak-futbolcu-source
          cat source-archive/part*.b64 | tr -d '\\n' | base64 --decode > /tmp/game-archive.xz
          xz -dc /tmp/game-archive.xz > /tmp/game-archive.raw
          if tar -tf /tmp/game-archive.raw >/dev/null 2>&1; then
            tar -xf /tmp/game-archive.raw -C /tmp/ortak-futbolcu-source
          elif unzip -t /tmp/game-archive.raw >/dev/null 2>&1; then
            unzip -q /tmp/game-archive.raw -d /tmp/ortak-futbolcu-source
          else
            echo "Unknown archive format"; exit 1
          fi
          source_file="$(find /tmp/ortak-futbolcu-source -type f -name server.py | head -n1)"
          test -n "$source_file"
          source_dir="$(dirname "$source_file")"
          test -f "$source_dir/game.py"
          test -f "$source_dir/accounts.py"
          test -f "$source_dir/requirements.txt"
          test -f "$source_dir/static/index.html"
          cp -a "$source_dir"/. ./
      - name: Run game tests
        run: |
          python -m pip install -r requirements-local.txt pytest
          PYTHONPATH=. python -m pytest -q
      - name: Commit source code to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md .gitignore TELEFONDAN_BASLAT.txt accounts.py game.py render.yaml requirements-local.txt requirements.txt server.py static tests
          if ! git diff --cached --quiet; then
            git commit -m "Publish playable multiplayer football game source"
            git push origin HEAD:main
          fi
