name: Apply v0.2 source update
on:
  push:
    paths:
      - '.github/workflows/apply-v02.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify update archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d updates/v02-source-patch.b64 > /tmp/patch.tar.xz
          echo "ba8fbef9c73fe67c92c69d6b3ec76bf5e08960c4a4b06f522ead35974c3c0c21  /tmp/patch.tar.xz" | sha256sum --check
          mkdir -p /tmp/of-patch
          tar xJf /tmp/patch.tar.xz -C /tmp/of-patch
          for patch in /tmp/of-patch/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cp /tmp/of-patch/social.py social.py
          mkdir -p tests
          cp /tmp/of-patch/test_social.py tests/test_social.py
          cp /tmp/of-patch/android/MainActivity.java android/app/src/main/java/com/ortakfutbolcu/game/MainActivity.java
          cp /tmp/of-patch/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install dependencies and run regression tests
        run: |
          python -m pip install -q -r requirements.txt pytest httpx
          PYTHONPATH=. python -m pytest -q
          node --check static/app.js
      - name: Publish validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.py server.py social.py static/app.js static/styles.css tests/test_social.py android/app/src/main/java/com/ortakfutbolcu/game/MainActivity.java android/app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Release v0.2: premium UI, persistent friends, invites, 11s single answer"
            git push origin HEAD:main
          fi
