name: Verify chats and game UI
on:
  push:
    paths:
      - 'social.py'
      - 'server.py'
      - 'static/**'
      - 'tests/**'
      - '.github/workflows/verify-chat-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Test existing gameplay, social and message flows
        run: PYTHONPATH=. python -m pytest -q
      - name: Verify browser JavaScript syntax
        run: node --check static/app.js
