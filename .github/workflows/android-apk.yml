name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../ortak-futbolcu-v0.4.6.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ortak-futbolcu-v0.4.6
          path: ortak-futbolcu-v0.4.6.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-v0.4.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload android-v0.4.6 ../ortak-futbolcu-v0.4.6.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create android-v0.4.6 ../ortak-futbolcu-v0.4.6.apk --repo "${{ github.repository }}" \
              --title 'Ortak Futbolcu Android v0.4.6 (Test)' \
              --notes 'v0.4.6: 1v1 maçlarda tüm veritabanı kulüpleri, arama ve kademeli takım listesi. Antrenman ve turnuva 60 kulüple devam eder. İnternet gerekir. Debug imzalıdır.'
          fi
